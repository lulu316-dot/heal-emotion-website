<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>阴阳星尘交互系统</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    const particleCount = 1500; // 粒子数量
    let angle = 0;

    // 配置参数
    const config = {
        coreRadius: 35,      // 核心半径
        orbitRadius: 80,     // 核心旋转半径
        rotationSpeed: 0.02, // 旋转速度
        particleBaseSpeed: 0.5,
        friction: 0.98       // 摩擦力
    };

    function init() {
        resize();
        createParticles();
        animate();
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            // 随机分布在屏幕圆周内
            const r = Math.random() * Math.max(width, height) * 0.5;
            const theta = Math.random() * Math.PI * 2;
            this.x = width / 2 + Math.cos(theta) * r;
            this.y = height / 2 + Math.sin(theta) * r;
            
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            
            this.size = Math.random() * 1.5 + 0.5;
            // 粒子颜色：模拟图片中的米白色、灰色和微黄色
            const colors = ['#ffffff', '#e5e5e5', '#d4c5b0', '#888888'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.alpha = Math.random() * 0.6 + 0.2;
        }

        update(coreA, coreB) {
            // 计算受力：核心引力和旋转力
            const cores = [coreA, coreB];
            
            cores.forEach((core, index) => {
                const dx = core.x - this.x;
                const dy = core.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 500) {
                    const force = (500 - distance) / 3000;
                    // 引力
                    this.vx += dx * force * 0.5;
                    this.vy += dy * force * 0.5;

                    // 旋转切向力 (创造漩涡感)
                    const direction = index === 0 ? 1 : -1; // 两个核心产生不同方向的微旋
                    this.vx += -dy * force * 0.8 * direction;
                    this.vy += dx * force * 0.8 * direction;
                }
            });

            this.vx *= config.friction;
            this.vy *= config.friction;
            
            this.x += this.vx;
            this.y += this.vy;

            // 边界检查：如果跑得太远就重置
            if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                this.reset();
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        // 关键：不完全清除画布，制造拖尾效果
        ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
        ctx.fillRect(0, 0, width, height);

        angle += config.rotationSpeed;

        // 计算阴阳两极的位置
        const coreA = {
            x: width / 2 + Math.cos(angle) * config.orbitRadius,
            y: height / 2 + Math.sin(angle) * config.orbitRadius,
            color: '#FFFFFF' // 阳
        };
        const coreB = {
            x: width / 2 + Math.cos(angle + Math.PI) * config.orbitRadius,
            y: height / 2 + Math.sin(angle + Math.PI) * config.orbitRadius,
            color: '#111111' // 阴
        };

        // 绘制星尘粒子
        particles.forEach(p => {
            p.update(coreA, coreB);
            p.draw();
        });

        // 绘制阴阳核心
        drawCore(coreA.x, coreA.y, config.coreRadius, coreA.color, true);
        drawCore(coreB.x, coreB.y, config.coreRadius, coreB.color, false);

        requestAnimationFrame(animate);
    }

    function drawCore(x, y, radius, color, isLight) {
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        
        // 给黑色核心加一个微弱的白边方便识别
        if (!isLight) {
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // 给白色核心加一点发光感
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'white';
        }
        
        ctx.fill();
        ctx.restore();
    }

    init();
</script>

</body>
</html>
