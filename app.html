<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>跨时空情感疗愈</title>
  <meta name="description" content="跨时空情感疗愈：与东西方哲人对话，在粒子生命树的生长中安放情绪，生成属于此刻的情绪卡片。">
  <meta name="theme-color" content="#0a0e1a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="跨时空情感疗愈">
  <meta property="og:description" content="与东西方哲人对话，在粒子生命树的生长中安放情绪，生成属于此刻的情绪卡片。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e1a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2387CEEB' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d4af37'/%3E%3C/svg%3E">
  <!--
    本次优化说明：
    首页转场动画实现原理：
    - 点击后不创建新 DOM，所有“引力汇聚”和“隧道穿越”都在首页 Canvas 的 requestAnimationFrame 中按时间差计算。
    - 0-0.6s 粒子使用 Lerp/easeInQuad 向点击点坍缩；0.6-1.0s 中心光洞向内放大填满屏幕；1.0s 后交给对话页景深浮现。
    - 对话页入场只使用 transform: translate3d(...) scale()、filter: blur() 和 opacity，配合 will-change 走 GPU 合成，避免 top/left/width/height 引发重排。
    - 转场期间 body 添加 home-transitioning，禁用滚动和指针事件，避免误触。

    1. 首页重写为“东方水墨场 + 西方几何星空 + 中央碰撞火花”，增强东西方碰撞视觉冲击。
    2. 对话页粒子树保持未初始化空状态，首条消息匹配导师后才初始化，并按 1-4 轮推进 0→25→55→85→100。
    3. 疗愈师回复改为关键词智能模拟，根据用户输入生成更有针对性的短回复，保持哲学家风格差异。
    4. 修复对话 4-5 轮后树消失：progress 在 setProgress/render 中双重 clamp 到 0-100，粒子树只在首条消息匹配后初始化一次，后续只 setProgress。
    5. 粒子树增加固定对象池健康检查、每 60 帧调试日志、布朗运动 noiseX/noiseY 和双层圆发光；非结晶阶段禁用 shadowBlur。
    6. 性能优化：对话页背景星点从 100 降到 50 并离屏缓存，树粒子对象池上限 300，关闭高成本阴影。
    7. 粒子树升级为“骨架 + 树冠叶簇”：generateBranches 生成 4-5 层分叉，末端用 3-5 个叶粒子加密树冠。
    8. 修复匹配机制：首页左右点击会持久化 camp，matchPhilosopher 按阵营严格匹配并输出得分日志。
    9. 回复升级为模板组合式，减少连续对话重复；消息滚动条和气泡样式更融入深色背景。
    10. 修复粒子形状重叠：树粒子只通过 drawParticle 单次绘制；重写 matchPhilosopher，西方阵营严格只在国外哲学家内匹配。
    11. 首页左侧融合 taiji-spiral-home.html：旧东方粒子替换为 TaijiSystem（太极旋转 + 超密动态星尘螺旋），并用 rgba(10,14,26,.04) 极长拖尾制造浩瀚星云带。
    12. 精准调参：左侧桌面约 2600 个 2.6-3.6px 动态粉尘星粒 + 桌面 24800/移动端 10400 离屏静态星尘；本次只优化动态星尘数量和颗粒感，其他保持不动。

    使用说明
    1. 如何测试：
       - 双击 app.html 运行。
       - 测试 1：首页点击左侧，输入“我很焦虑”，应匹配王阳明；连续发送 8 轮后树会结晶，可生成卡片。
       - 测试 2：首页点击右侧，输入“讨好别人很累”，应匹配阿德勒；连续发送多轮，8 轮后结晶，48 轮仍稳定保留最近 20 条 DOM 消息。
       - 测试 3：进入对话页后，在萌芽阶段直接点击“📷 保存此刻”，生成萌芽状态卡片。
    2. 如何修改哲学家配置：
       - 搜索“模块②：哲学家配置”，修改 Philosophy.configs / replies / card_quote_pool。
    3. 如何调整性能参数：
       - 搜索“PerfConfig”，可调整桌面/移动端粒子数、低 FPS 阈值、降级比例。
  -->
  <style>
    @font-face {
      font-family: "InterLocal";
      src: local("Inter");
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0e1a;
      color: #e2e8f0;
      font-family: InterLocal, "Noto Serif SC", "Microsoft YaHei", sans-serif;
      touch-action: manipulation;
    }

    * { box-sizing: border-box; }
    button, input { font: inherit; }
    canvas { will-change: transform; }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0a0e1a;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 8px, 0);
      transition: opacity .32s ease, transform .32s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    #homeCanvas,
    #treeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0a0e1a;
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      background: #fff;
    }

    @keyframes breath {
      0%, 100% { opacity: .5; }
      50% { opacity: .9; }
    }

    #chatPage {
      display: grid;
      grid-template-columns: 40% 60%;
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      overflow: hidden;
      background: #0a0e1a;
      will-change: transform, filter, opacity;
      transform-origin: center center;
    }

    #chatPage.inner-enter {
      opacity: 0;
      transform: translate3d(0, 30px, 0) scale(.95);
      filter: blur(8px);
    }

    #chatPage.inner-enter.active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0);
      transition: opacity .5s ease, transform .5s cubic-bezier(.16, 1, .3, 1), filter .5s ease;
    }

    body.home-transitioning {
      overflow: hidden;
      cursor: wait;
    }

    body.home-transitioning * {
      pointer-events: none !important;
    }

    .treePane {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #0a0e1a;
      border-right: 1px solid rgba(255,255,255,.05);
    }

    .chatPane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100vh;
      overflow: hidden;
      background: #0a0e1a;
      will-change: transform;
    }

    .mentorBar {
      height: 80px;
      flex: 0 0 80px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) 72px 14px 24px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      transition: opacity .3s ease;
    }

    .mentorBar.fade { opacity: 0; }
    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #0f172a;
      font-weight: 800;
      box-shadow: 0 0 24px rgba(255,255,255,.15);
    }

    .mentorName { color: #fff; font-size: 16px; line-height: 1.3; }
    .mentorSlogan {
      margin-top: 4px;
      color: rgba(226,232,240,.62);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(48vw, 520px);
    }

    .dots { display: inline-flex; gap: 6px; margin-left: 8px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.72);
      animation: dot 1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .16s; }
    .dots i:nth-child(3) { animation-delay: .32s; }
    @keyframes dot {
      0%,100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }

    .messages {
      position: relative;
      contain: layout style paint;
      flex: 1 1 auto;
      min-height: 0;
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      will-change: transform;
      padding: 24px clamp(18px, 4vw, 56px);
      scroll-behavior: auto;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .message {
      display: flex;
      margin-bottom: 16px;
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: rise .2s ease forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translate3d(0,0,0); } }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: 70%; overflow-wrap: anywhere; }
    .message.user .bubble {
      padding: 11px 16px;
      border-radius: 16px;
      background: rgba(30, 58, 138, 0.6);
      color: #fff;
      font: 15px/1.7 "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(4px);
    }
    .message.ai .bubble {
      color: rgba(226, 232, 240, 0.9);
      font: 16px/1.8 "Noto Serif SC", "Songti SC", serif;
      text-shadow: 0 0 20px rgba(255,255,255,.08);
      backdrop-filter: blur(4px);
    }

    .inputArea {
      height: 80px;
      flex: 0 0 80px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 24px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,.05);
    }
    .inputWrap {
      flex: 1;
      height: 48px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 24px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .inputWrap.focused {
      border-color: var(--mentor-color, #87CEEB);
      box-shadow: 0 0 18px var(--mentor-glow, rgba(135,206,235,.38));
    }
    #userInput {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      padding: 0 18px;
      background: transparent;
      color: rgba(255,255,255,.92);
      font-size: 16px;
    }
    #userInput::placeholder { color: rgba(255,255,255,.4); }

    .roundBtn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: opacity .18s ease, transform .18s ease, background .18s ease;
    }
    .roundBtn:hover { transform: translateY(-1px); background: rgba(255,255,255,.14); }
    #sendBtn { flex: 0 0 48px; font-size: 24px; line-height: 1; }
    #saveBtn, #homeBtn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      z-index: 20;
    }
    #saveBtn { right: 16px; font-size: 21px; }
    #homeBtn { right: 72px; opacity: .3; font-size: 18px; }
    #homeBtn:hover { opacity: .8; }

    #fps {
      position: fixed;
      right: 12px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 40;
      border: 0;
      padding: 0;
      background: transparent;
      color: rgba(255,255,255,.5);
      font: 12px/1.4 Consolas, Monaco, monospace;
      cursor: pointer;
    }
    #fps.hidden { opacity: 0; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 60;
      padding: 9px 14px;
      border-radius: 18px;
      background: rgba(15,23,42,.82);
      color: #fff;
      opacity: 0;
      transform: translate3d(-50%, 10px, 0);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate3d(-50%, 0, 0); }

    .cardModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(2,6,23,.68);
      backdrop-filter: blur(10px);
      touch-action: none;
    }
    .cardModal.show { display: grid; }
    .previewBox {
      display: grid;
      gap: 14px;
      justify-items: center;
      opacity: 0;
      transform: translate3d(0,14px,0) scale(.98);
      transition: opacity .22s ease, transform .22s ease;
    }
    .cardModal.show .previewBox { opacity: 1; transform: translate3d(0,0,0) scale(1); }
    #cardPreview {
      width: min(390px, 88vw);
      max-height: min(680px, 78vh);
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 28px 90px rgba(0,0,0,.44);
      background: #0f172a;
      transform-origin: center center;
    }
    .modalActions {
      display: flex;
      width: min(390px, 88vw);
      gap: 10px;
    }
    .modalActions button {
      flex: 1;
      height: 40px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      color: #fff;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .noCanvas {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
      place-items: center;
      background: #0f172a;
      color: #fff;
      padding: 24px;
      text-align: center;
      font-size: 18px;
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      #chatPage { grid-template-columns: 35% 65%; }
      .mentorSlogan { max-width: 44vw; }
    }

    @media (max-width: 767px) {
      #chatPage { grid-template-columns: 1fr; grid-template-rows: 40vh 60vh; }
      .treePane { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.05); }
      .mentorBar { height: 70px; flex-basis: 70px; padding: 12px 118px 12px 16px; }
      .messages { padding: 16px; }
      .bubble { max-width: 84%; }
      .inputArea {
        height: auto;
        min-height: 76px;
        padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      }
      #saveBtn { right: 14px; top: max(12px, env(safe-area-inset-top)); }
      #homeBtn { right: 68px; top: max(12px, env(safe-area-inset-top)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="noCanvas" class="noCanvas">您的浏览器不支持 Canvas，请升级浏览器</div>
  <main id="app">
    <section id="homePage" class="page active">
      <canvas id="homeCanvas" aria-hidden="true"></canvas>
    </section>
    <section id="chatPage" class="page">
      <div class="treePane"><canvas id="treeCanvas" aria-hidden="true"></canvas></div>
      <div class="chatPane">
        <header id="mentorBar" class="mentorBar"></header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <footer class="inputArea">
          <div id="inputWrap" class="inputWrap"><input id="userInput" autocomplete="off" aria-label="写下你的心声" placeholder="写下你的心声..."></div>
          <button id="sendBtn" class="roundBtn" type="button" aria-label="发送">→</button>
        </footer>
      </div>
    </section>
  </main>
  <button id="homeBtn" class="roundBtn" type="button" title="返回首页" aria-label="返回首页">🏠</button>
  <button id="saveBtn" class="roundBtn" type="button" title="保存此刻" aria-label="保存此刻">📷</button>
  <div id="flash" class="flash"></div>
  <button id="fps" type="button" aria-label="切换帧率显示">FPS 60</button>
  <div id="toast" class="toast"></div>
  <div id="cardModal" class="cardModal" aria-hidden="true">
    <div class="previewBox">
      <img id="cardPreview" alt="情绪卡片预览" loading="lazy">
      <div class="modalActions">
        <button id="downloadBtn" type="button">保存到本地</button>
        <button id="continueBtn" type="button">继续对话</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    /* 调试开关：默认关闭。需要排查时在 URL 加 ?debug 或运行 localStorage.setItem("healingDebug","1")。 */
    const DEBUG = (() => {
      try {
        if (/[?&]debug\b/.test(location.search)) return true;
        return localStorage.getItem("healingDebug") === "1";
      } catch (e) { return false; }
    })();
    const Log = {
      log: DEBUG ? console.log.bind(console) : function(){},
      info: DEBUG ? console.info.bind(console) : function(){},
      warn: DEBUG ? console.warn.bind(console) : function(){},
      table: DEBUG ? console.table.bind(console) : function(){},
      group: DEBUG ? console.group.bind(console) : function(){},
      groupEnd: DEBUG ? console.groupEnd.bind(console) : function(){},
      error: console.error.bind(console)
    };

    /* ═══════ 模块⑥：全局整合 ═══════ */
    const AppState = {
      currentPage: "home",
      currentPhilosopher: null,
      growthProgress: 0,
      conversationHistory: [],
      camp: "eastern"
    };

    const PerfConfig = {
      homeParticlesDesktop: 200,
      treeParticlesDesktop: 300,
      mobileParticles: 100,
      lowFpsThreshold: 45,
      highFpsThreshold: 57,
      isMobile: matchMedia("(max-width: 767px)").matches,
      reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches
    };

    const EventHub = {
      map: new WeakMap(),
      on(target, type, handler, options) {
        target.addEventListener(type, handler, options);
        let list = this.map.get(target);
        if (!list) {
          list = [];
          this.map.set(target, list);
        }
        list.push({ type, handler, options });
      },
      offAll(target) {
        const list = this.map.get(target);
        if (!list) return;
        for (let i = 0; i < list.length; i++) {
          target.removeEventListener(list[i].type, list[i].handler, list[i].options);
        }
        this.map.delete(target);
      }
    };

    const Dom = {};
    function $(id) { return document.getElementById(id); }
    function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInQuad(t) { return t * t; }
    function easeOutCubic(t) { const n = 1 - t; return 1 - n * n * n; }
    function hexToRgba(hex, alpha) {
      const n = parseInt(hex.slice(1), 16);
      return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + alpha + ")";
    }
    function showToast(text) {
      Dom.toast.textContent = text;
      Dom.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => Dom.toast.classList.remove("show"), 1800);
    }

    const LUT_SIZE = 4096;
    const LUT_MASK = LUT_SIZE - 1;
    const TAU = Math.PI * 2;
    const sinLut = new Float32Array(LUT_SIZE);
    const cosLut = new Float32Array(LUT_SIZE);
    const randomLut = new Float32Array(LUT_SIZE);
    const noiseLut = new Float32Array(LUT_SIZE);
    let seed = 20260709;
    for (let i = 0; i < LUT_SIZE; i++) {
      const a = i / LUT_SIZE * TAU;
      sinLut[i] = Math.sin(a);
      cosLut[i] = Math.cos(a);
      seed = (seed * 1664525 + 1013904223) >>> 0;
      randomLut[i] = seed / 4294967296;
      noiseLut[i] = Math.sin(a) * .5 + Math.sin(a * 2.7 + 1.8) * .32 + Math.sin(a * 5.1 + 2.4) * .18;
    }
    function lut(v) { return (v | 0) & LUT_MASK; }
    // 快速三角：把弧度映射到 LUT 索引，避免每帧上万次 Math.sin/cos。负角靠二进制补码回绕，周期性正确。
    const ANG = LUT_SIZE / TAU;
    function fsin(a) { return sinLut[((a * ANG) | 0) & LUT_MASK]; }
    function fcos(a) { return cosLut[((a * ANG) | 0) & LUT_MASK]; }
    // 动态星尘配色：索引与 TaijiSystem.init 的 roll 分档一致（0=天蓝 1=金 2=白）。分桶批绘时按此顺序取色。

      tick(now) {

      buildPrompt(p, userText) {

          "你是一位跨时空情感疗愈导师："+p.name+"。",
          "人设口吻："+p.slogan,
          "情绪标签："+(p.tags||[]).join("、"),
          "回复规则：第一句先接住情绪；总字数不超过50个中文字符；不要承认自己是AI；不要反问；结尾用一句符合人设的哲理短句。",
          "用户烦恼："+userText
        ].join("\n");
      },
      clean(text) {
        const t = String(text || "").replace(/\s+/g,"").replace(/^["“”]+|["“”]+$/g,"");
        return t.length > 50 ? t.slice(0,50) : t;
      },
      async reply(p, userText) {
        await this.load();
        if (!this.available()) { Log.info("[AIReplyService] API 未启用或未配置 Key，使用本地模拟回复"); return ""; }
        const c = this.config, provider = String(c.provider || "gemini").toLowerCase();
        const prompt = this.buildPrompt(p, userText);
        if (provider === "openai" || provider === "mimo" || provider === "xiaomi" || provider === "xiaomi mimo") return this.clean(await this.openai(c, prompt));
        return this.clean(await this.gemini(c, prompt));
      },
      async gemini(c, prompt) {
        const model = c.model || "gemini-1.5-flash";
        const url = c.endpoint || ("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(c.apiKey));
        const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ contents:[{ role:"user", parts:[{ text:prompt }] }], generationConfig:{ temperature:c.temperature ?? .7, maxOutputTokens:c.maxOutputTokens || 80 } }) });
        if (!res.ok) throw new Error("Gemini API failed: "+res.status);
        const data = await res.json();
        return data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts ? data.candidates[0].content.parts.map(x=>x.text||"").join("") : "";
      },
      async openai(c, prompt) {
        let url = c.endpoint || "https://api.openai.com/v1/chat/completions";
        if (/\/v1\/?$/.test(url)) url = url.replace(/\/$/,"") + "/chat/completions";
        const isMimo = /xiaomimimo/i.test(url) || /mimo|xiaomi/i.test(String(c.provider || ""));
        const headers = isMimo ? { "Content-Type":"application/json", "api-key":c.apiKey } : { "Content-Type":"application/json", "Authorization":"Bearer "+c.apiKey };
        const body = { model:c.model || (isMimo ? "mimo-v2.5-pro" : "gpt-4o-mini"), messages:[{ role:"system", content:"你是短句情感疗愈导师，严格遵守用户要求。" },{ role:"user", content:prompt }], temperature:c.temperature ?? .7 };
        if (isMimo) { body.max_completion_tokens = Math.max(c.maxOutputTokens || 80, 2048); body.top_p = c.topP ?? .95; body.stream = false; body.stop = null; body.frequency_penalty = 0; body.presence_penalty = 0; }
        else body.max_tokens = c.maxOutputTokens || 80;
        const res = await fetch(url, { method:"POST", headers, body:JSON.stringify(body) });
        if (!res.ok) throw new Error("OpenAI API failed: "+res.status);
        const data = await res.json();
        return data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
      }

          const start = performance.now();
          this.lastCard = await this.card.generateCard(config, treeImage, quote);
          if (performance.now() - start > 500) Log.warn("卡片生成超过 500ms");
          this.modal.show(this.lastCard);
        } catch (err) {
          console.error(err);
          showToast("生成失败，请重试");
        }
      }
    };

    /** 初始化完整应用。 */
    window.addEventListener("DOMContentLoaded", () => App.init(), { once:true });

    /** 公共 API：匹配哲学家。 */
    window.matchPhilosopher = Philosophy.matchPhilosopher;
    /** 公共 API：生成卡片。 */
    window.generateCard = (philosopherConfig, treeImageData, quote) => App.card.generateCard(philosopherConfig, treeImageData, quote);
    /** 公共 API：获取树截图。 */
    window.getTreeImageData = () => App.tree ? App.tree.getImageData() : "";
    /** 公共 API：触发树结晶。 */
    window.triggerCrystallize = () => { if(App.chat)App.chat.cancelProgressAnimation(); if(App.tree)App.tree.crystallize(); };
    window.AppState = AppState;
  </script>
</body>
</html>
